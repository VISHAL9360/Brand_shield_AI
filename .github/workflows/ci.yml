name: Production CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Suite & Cryptographic Audit Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-32-chars-long-2026!
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      ASYNC_DATABASE_URL: sqlite+aiosqlite:///:memory:
      PORTABLE_VECTOR_MODE: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Execute Full Pytest Suite with Coverage
        run: |
          python -m pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: Verify Cryptographic Audit Chain Ledger
        run: |
          python -m pytest -v tests/test_audit_chain_verification.py

      - name: Validate OpenAPI & Contract Export
        run: |
          python scripts/export_contracts.py
          git status
